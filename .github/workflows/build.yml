name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's Ubuntu runners already include the Android SDK (ANDROID_HOME is set).
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core brain)
        run: ./gradlew :core:test --no-daemon

      - name: Build debug APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk nexus.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-debug-apk
          path: nexus.apk

      # Publishes the APK at a fixed, easy link:
      # https://github.com/<owner>/<repo>/releases/latest/download/nexus.apk
      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: NEXUS latest build
          body: |
            Download **nexus.apk** below and open it on your Android phone to install.
            Built from commit ${{ github.sha }}.
          files: nexus.apk
          make_latest: true
          prerelease: false

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: core/build/reports/tests/
